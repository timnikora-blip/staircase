# Builds the Staircase dashboard on GitHub's servers and publishes it to GitHub Pages.
# Times are UTC. GitHub can start scheduled runs 5–20 minutes late, and when it's busy it may skip one.
name: Dashboard

on:
  schedule:
    - cron: "30 1 * * 2-6"     # evening after the close (8:30 pm New York in winter, 9:30 pm in summer)
    - cron: "30 12 * * 1-5"    # before the open, when Yahoo has filled in the previous session
  workflow_dispatch:             # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan the whole US market
        run: python -m backtest.staircase_dashboard --cloud --no-open --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
